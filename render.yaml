services:
  - type: web
    name: cp-discord-bot
    runtime: python
    pythonVersion: 3.14
    buildCommand: pip install -r requirements.txt
    startCommand: python -u bot.py
    healthCheckPath: /health
    healthCheckProtocol: http
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RENDER_URL
        sync: false
      - key: PREFIX
        value: "!"
      - key: ADMIN_ROLE
        value: "Admin"
      - key: PORT
        value: "10000"
      - key: GUILD_ID
        sync: false # Discord server ID the website reads stats for
      - key: BB_API_KEY
        sync: false # must match BB_API_KEY on the website backend
      - key: BB_ALLOWED_ORIGINS
        sync: false # comma-separated browser origins, e.g. https://your-site.vercel.app
