services:
  - type: web
    name: cp-discord-bot
    runtime: python
    pythonVersion: 3.14
    buildCommand: pip install -r requirements.txt
    startCommand: python -u bot.py
    healthCheckPath: /health
    healthCheckProtocol: http
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RENDER_URL
        sync: false
      - key: PREFIX
        value: "!"
      - key: ADMIN_ROLE
        value: "Admin"
      - key: PORT
        value: "10000"